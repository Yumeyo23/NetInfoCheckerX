name: Delete Old Releases

on:
  workflow_dispatch: # 手动触发

jobs:
  del_releases:
    runs-on: ubuntu-latest
    steps:
      - name: Delete releases
        uses: dev-drprasad/delete-older-releases@v0.3.3
        with:
          keep_latest: 3
          # exclude_tags: "v1.0.0,v2.0.0" 
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
